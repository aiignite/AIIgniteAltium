server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:3295;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;   # SSE 流式必需
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
